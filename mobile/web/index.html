<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080E1A">
  <meta name="description" content="FleetLuma infrastructure monitoring dashboard">
  <title>FleetLuma</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #080e1a; }
    body { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    #fleetluma-boot {
      position: fixed; inset: 0; z-index: 999999;
      display: flex; align-items: center; justify-content: center;
      background: #080e1a; color: #f3f7ff; text-align: center;
      padding: 24px; box-sizing: border-box;
    }
    #fleetluma-boot[hidden] { display: none; }
    .fleetluma-boot-card { max-width: 390px; }
    .fleetluma-brand { font-size: 27px; font-weight: 750; letter-spacing: -0.7px; }
    .fleetluma-status { margin-top: 16px; color: #a1afca; line-height: 1.6; font-size: 14px; }
    .fleetluma-spinner {
      width: 30px; height: 30px; margin: 26px auto;
      border: 3px solid #27374e; border-top-color: #55e5d3;
      border-radius: 50%; animation: fleetluma-spin 0.9s linear infinite;
    }
    @keyframes fleetluma-spin { to { transform: rotate(360deg); } }
    #fleetluma-retry {
      margin-top: 16px; padding: 12px 22px; border: 0;
      background: #55e5d3; color: #0b1222; border-radius: 10px;
      font-weight: 700; cursor: pointer;
    }
    #fleetluma-retry[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="fleetluma-boot" role="status" aria-live="polite">
    <div class="fleetluma-boot-card">
      <div class="fleetluma-brand">FleetLuma</div>
      <div id="fleetluma-status" class="fleetluma-status">Loading your monitoring dashboard...</div>
      <div id="fleetluma-spinner" class="fleetluma-spinner" aria-hidden="true"></div>
      <button id="fleetluma-retry" type="button" hidden>Reload dashboard</button>
    </div>
  </div>
  <script>
    (function () {
      var screen = document.getElementById('fleetluma-boot');
      var status = document.getElementById('fleetluma-status');
      var spinner = document.getElementById('fleetluma-spinner');
      var retry = document.getElementById('fleetluma-retry');
      var firstFrame = false;
      function showRecovery() {
        if (firstFrame) return;
        status.textContent = 'FleetLuma could not finish loading. Check your connection, then reload.';
        spinner.hidden = true;
        retry.hidden = false;
        screen.setAttribute('role', 'alert');
      }
      retry.addEventListener('click', function () { window.location.reload(); });
      window.addEventListener('flutter-first-frame', function () {
        firstFrame = true;
        screen.hidden = true;
        screen.setAttribute('aria-hidden', 'true');
      }, { once: true });
      window.addEventListener('error', function (event) {
        // Keep sensitive exception details out of the public boot screen.
        if (event.target && event.target.tagName === 'SCRIPT') showRecovery();
      }, true);
      window.setTimeout(showRecovery, 20000);
    }());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
