name: Flutter Web build
on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-web.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-web.yml'
permissions:
  contents: read
jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter Web scaffolding
        working-directory: mobile
        run: flutter create --platforms=web --project-name fleetluma .
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Unit and widget tests
        working-directory: mobile
        run: flutter test
      - name: Release Web build (non-secret placeholder API origin)
        working-directory: mobile
        run: flutter build web --release --dart-define=FLEETLUMA_API_BASE_URL=https://api.example.invalid --dart-define=FLEETLUMA_CLOUD_MODE=true --dart-define=FLEETLUMA_SUPABASE_URL=https://demo.supabase.co --dart-define=FLEETLUMA_SUPABASE_PUBLISHABLE_KEY=sb_publishable_placeholder
      - name: Assert web bundle generated
        run: test -f mobile/build/web/index.html
      - name: Upload static Web build for subsequent Vercel deployment
        uses: actions/upload-artifact@v4
        with:
          name: fleetluma-flutter-web-preview
          path: mobile/build/web/
          if-no-files-found: error
