name: Backend tests
on:
  push:
    paths: ['backend/**', 'agent/**', '.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['backend/**', 'agent/**', '.github/workflows/backend-tests.yml']
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend and real-agent-payload integration tests
        working-directory: backend
        run: python -m pytest -q tests
