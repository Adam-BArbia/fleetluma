name: Windows agent frozen binary candidate
on:
  workflow_dispatch:
  push:
    paths:
      - 'agent/**'
      - '.github/workflows/windows-agent-package.yml'
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/windows-agent-package.yml'

permissions:
  contents: read

jobs:
  build-windows-candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and frozen packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agent/requirements.txt
          python -m pip install "pyinstaller==6.16.0"
      - name: Test Windows agent before freezing
        working-directory: agent
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Build Windows monitoring service candidate
        shell: pwsh
        run: >
          python -m PyInstaller --noconfirm --clean --onedir
          --name FleetLumaAgent --paths agent
          --hidden-import servicemanager
          --hidden-import win32timezone
          --hidden-import win32serviceutil
          --hidden-import win32pipe
          --hidden-import win32security
          agent/packaging/windows/service_entry.py
      - name: Build elevated Windows configuration interface candidate
        shell: pwsh
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --uac-admin --name FleetLumaSetup --paths agent
          agent/packaging/windows/setup_entry.py
      - name: Verify expected candidate files
        shell: pwsh
        run: |
          if (!(Test-Path "dist/FleetLumaAgent/FleetLumaAgent.exe")) { throw "Service executable missing" }
          if (!(Test-Path "dist/FleetLumaSetup.exe")) { throw "Setup executable missing" }
          Get-Item "dist/FleetLumaAgent/FleetLumaAgent.exe","dist/FleetLumaSetup.exe" |
            Select-Object Name,Length
      - name: Package unsigned preview binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "dist/FleetLumaAgent" "package/FleetLumaAgent" -Recurse -Force
          Copy-Item "dist/FleetLumaSetup.exe" "package/FleetLumaSetup.exe" -Force
          Set-Content "package/NOT_FOR_RELEASE.txt" "DEVELOPER ONLY. UNSIGNED. NOT A USER INSTALLER. No verified service registration, ACLs, or end-to-end pairing."
          Compress-Archive -Path "package/*" -DestinationPath "FleetLuma-Windows-UNSIGNED-CANDIDATE.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: fleetluma-windows-unsigned-candidate
          path: FleetLuma-Windows-UNSIGNED-CANDIDATE.zip
          if-no-files-found: error
          retention-days: 7
