name: Windows unsigned installer candidate
on:
  workflow_dispatch:
  push:
    paths:
      - 'agent/**'
      - '.github/workflows/windows-agent-installer.yml'
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/windows-agent-installer.yml'

permissions:
  contents: read

jobs:
  build-unsigned-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install agent dependencies
        shell: pwsh
        run: |
          python -m pip install -r agent/requirements.txt
          python -m pip install "pyinstaller==6.16.0"
      - name: Run Windows agent tests
        working-directory: agent
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Build service executable
        shell: pwsh
        run: >
          python -m PyInstaller --noconfirm --clean --onedir
          --name FleetLumaAgent --paths agent
          --hidden-import servicemanager
          --hidden-import win32timezone
          --hidden-import win32serviceutil
          --hidden-import win32pipe
          --hidden-import win32security
          agent/packaging/windows/service_entry.py
      - name: Build UAC-elevated desktop setup executable
        shell: pwsh
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --uac-admin --name FleetLumaSetup --paths agent
          agent/packaging/windows/setup_entry.py
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile unsigned Windows installer candidate
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler was not found" }
          & $iscc "agent/packaging/windows/FleetLumaAgent.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
      - name: Verify installer candidate exists
        shell: pwsh
        run: |
          $installer = "dist/windows-installer/FleetLuma-Agent-Windows-UNSIGNED-CANDIDATE.exe"
          if (!(Test-Path $installer)) { throw "Windows installer output missing" }
          Get-Item $installer | Select-Object FullName,Length
          Write-Output "DEVELOPER CANDIDATE ONLY: unsigned, not tested on a clean Windows host."
      - uses: actions/upload-artifact@v4
        with:
          name: fleetluma-windows-unsigned-installer
          path: dist/windows-installer/FleetLuma-Agent-Windows-UNSIGNED-CANDIDATE.exe
          retention-days: 7
          if-no-files-found: error
