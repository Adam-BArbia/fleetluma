name: FleetLuma V1 pairing preview safety smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v1-pairing-preview-smoke.yml'
permissions:
  contents: read
jobs:
  probe-pairing-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_ORIGIN: https://fleetluma-h2nlyfk1h-fleet-luma.vercel.app
    steps:
      - name: Fail closed on health and enrollment auth
        run: |
          python3 - <<'PY'
          import os, json
          from urllib.request import Request, build_opener, HTTPRedirectHandler, ProxyHandler
          from urllib.error import HTTPError

          class BlockRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = build_opener(BlockRedirect(), ProxyHandler({}))
          def probe(path):
              req = Request(os.environ["API_ORIGIN"] + path,
                            method="GET", headers={"Accept":"application/json"})
              try:
                  with opener.open(req, timeout=15) as r:
                      return r.status, r.read(2048)
              except HTTPError as e:
                  return e.code, b""

          status, body = probe("/health")
          if status != 200:
              raise SystemExit(f"FAIL: pairing preview /health HTTP {status}")
          data = json.loads(body)
          if data.get("status") != "ready" or data.get("mode") != "cloud":
              raise SystemExit("FAIL: preview health not ready/cloud")
          status, _ = probe("/api/v1/operator/workspaces")
          if status != 401:
              raise SystemExit(f"FAIL: operator workspace route must challenge 401, got {status}")
          status, _ = probe("/api/v1/agent/pairings")
          if status != 405:
              raise SystemExit(f"FAIL: expected registered POST pairing route (GET 405), got {status}")
          status, _ = probe("/api/v1/hosts")
          if status not in (401, 403):
              raise SystemExit(f"FAIL: host monitoring exposed without JWT (HTTP {status})")
          print("PASS: pairing preview DB ready, routes enabled, operator routes locked")
          PY

      - name: Start and cancel a synthetic pairing (no host enrollment)
        run: |
          python3 - <<'PY'
          import hashlib, json, os, secrets
          from urllib.request import Request, build_opener, HTTPRedirectHandler, ProxyHandler
          from urllib.error import HTTPError

          class BlockRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = build_opener(BlockRedirect(), ProxyHandler({}))
          origin = os.environ["API_ORIGIN"]

          def post(path, obj):
              req = Request(origin + path,
                            data=json.dumps(obj).encode(),
                            method="POST",
                            headers={"Content-Type": "application/json"})
              with opener.open(req, timeout=15) as r:
                  return r.status, r.read(4096)

          random_digest = hashlib.sha256(secrets.token_bytes(32)).hexdigest()
          payload = {
              "hostname": "fleetluma-smoke-" + secrets.token_hex(4),
              "platform": "linux",
              "agent_version": "v1.0-smoke",
              "report_token_sha256": random_digest,
              "capabilities": ["cpu", "memory", "disk"]
          }
          status, response = post("/api/v1/agent/pairings", payload)
          if status != 201:
              raise SystemExit("FAIL: pairing request was not accepted")
          result = json.loads(response)
          device_code = result.get("device_code")
          if not isinstance(device_code, str) or len(device_code) < 32:
              raise SystemExit("FAIL: pairing response lacked a private device code")
          try:
              if len(result.get("user_code", "")) != 9:
                  raise SystemExit("FAIL: public user code malformed")
              if result.get("expires_in") != 600:
                  raise SystemExit("FAIL: unexpected expiry")
          finally:
              code, _ = post("/api/v1/agent/pairings/cancel", {"device_code": device_code})
              if code != 204:
                  raise SystemExit("FAIL: synthetic session cancellation failed")
          print("PASS: synthetic pairing created and cancelled without enrolling a host")
          PY
