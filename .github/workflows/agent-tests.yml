name: Agent tests
on:
  push:
    paths: ['agent/**', '.github/workflows/agent-tests.yml']
  pull_request:
    paths: ['agent/**', '.github/workflows/agent-tests.yml']
permissions:
  contents: read
jobs:
  unittest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r agent/requirements.txt
      - name: Run monitoring agent tests
        working-directory: agent
        run: python -m unittest discover -s tests -v
