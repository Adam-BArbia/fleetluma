name: Windows agent installer isolated acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/windows-agent-install-smoke.yml'

permissions:
  contents: read

jobs:
  isolated-windows-acceptance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare native candidate build tools
        shell: pwsh
        run: |
          python -m pip install -r agent/requirements.txt
          python -m pip install "pyinstaller==6.16.0"
          choco install innosetup --yes --no-progress
      - name: Run agent unit tests
        working-directory: agent
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Freeze Windows service and setup UI
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --name FleetLumaAgent --paths agent --hidden-import servicemanager --hidden-import win32timezone --hidden-import win32serviceutil --hidden-import win32pipe --hidden-import win32security agent/packaging/windows/service_entry.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name FleetLumaSetup --paths agent agent/packaging/windows/setup_entry.py
      - name: Compile unsigned installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "agent/packaging/windows/FleetLumaAgent.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - name: Verify installer process launches and registers service
        shell: pwsh
        run: |
          $installer = (Resolve-Path "dist/windows-installer/FleetLuma-Agent-Windows-UNSIGNED-CANDIDATE.exe").Path
          $proc = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Inno installer returned exit $($proc.ExitCode)" }
          for ($i = 0; $i -lt 30; $i++) {
            $service = Get-Service -Name FleetLumaAgent -ErrorAction SilentlyContinue
            if ($service -and $service.Status -eq "Running") { break }
            Start-Sleep -Seconds 1
          }
          $service = Get-Service -Name FleetLumaAgent -ErrorAction Stop
          if ($service.Status -ne "Running") { throw "FleetLumaAgent is not running after install" }
          $sid = & sc.exe qsidtype FleetLumaAgent | Out-String
          if ($sid -notmatch "UNRESTRICTED") { throw "Service SID was not enabled" }
          if (!(Test-Path "${env:ProgramData}\FleetLuma\private")) { throw "Credential directory missing" }
          Write-Output "Isolated Windows SCM start OK. No production enrollment requested."
      - name: Verify local pipe status without credentials
        working-directory: agent
        shell: pwsh
        run: |
          python -c "from fleetluma_agent.windows_control import windows_command; result=windows_command('status'); assert result.get('status')=='not_paired', result.get('status'); assert 'report_token' not in result; assert 'device_code' not in result; print('Restricted pipe status response OK')"
      - name: Verify no broad access on protected identity directory
        shell: pwsh
        run: |
          $path = "${env:ProgramData}\FleetLuma\private"
          $acl = Get-Acl -Path $path
          foreach ($rule in $acl.Access) {
            if ($rule.AccessControlType -eq "Allow" -and
                $rule.IdentityReference.Value -match "Everyone|Users|Authenticated Users") {
              throw "Overbroad access to private service state: $($rule.IdentityReference)"
            }
          }
          Write-Output "No explicit broad Windows directory allow ACEs found"
      - name: Uninstall and verify Windows service removal
        shell: pwsh
        run: |
          $uninstaller = "${env:ProgramFiles}\FleetLuma\unins000.exe"
          if (!(Test-Path $uninstaller)) { throw "Expected uninstaller missing" }
          $proc = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Uninstaller returned exit $($proc.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Get-Service -Name FleetLumaAgent -ErrorAction SilentlyContinue) {
            throw "FleetLuma service still registered after uninstall"
          }
          if (Test-Path "${env:ProgramData}\FleetLuma\private\identity.bin") {
            throw "Device credential survived explicit uninstall"
          }
          Write-Output "Isolated uninstall OK"
