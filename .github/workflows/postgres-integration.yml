name: PostgreSQL integration (FL-15)
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/postgres-integration.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/postgres-integration.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password_only
          POSTGRES_DB: fleetluma_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fleetluma_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FLEETLUMA_TEST_DATABASE_URL: postgresql://postgres:ci_test_password_only@127.0.0.1:5432/fleetluma_ci
      PGPASSWORD: ci_test_password_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies and psql client
        run: |
          python -m pip install -r backend/requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare Supabase role equivalents for isolated CI
        run: |
          psql -h 127.0.0.1 -U postgres -d fleetluma_ci -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated;'
      - name: Apply reviewed PostgreSQL schema
        run: |
          psql -h 127.0.0.1 -U postgres -d fleetluma_ci -v ON_ERROR_STOP=1 -f backend/sql/FL-15_cloud_schema.sql
      - name: Run real PostgreSQL integration tests
        working-directory: backend
        run: python -m pytest -q tests/test_postgres_integration.py

      - name: Seed synthetic Supabase Auth owner and pre-migration TUFFEST
        run: |
          psql -h 127.0.0.1 -U postgres -d fleetluma_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY);
          INSERT INTO auth.users(id) VALUES ('11111111-1111-4111-8111-111111111111');
          INSERT INTO fleetluma.hosts(id,name,os,token_hash)
          VALUES ('22222222-2222-4222-8222-222222222222','TUFFEST','windows',repeat('a',64));
          INSERT INTO fleetluma.samples(host_id,sampled_at,metrics)
          VALUES ('22222222-2222-4222-8222-222222222222',now(),'{"cpu_pct":1,"ram_used_bytes":1,"ram_total_bytes":10,"disk_path":"C:","disk_used_bytes":1,"disk_total_bytes":10}');
          SQL
      - name: Apply FL-32 additive pairing schema in CI only
        run: |
          psql -h 127.0.0.1 -U postgres -d fleetluma_ci -v ON_ERROR_STOP=1 -f backend/sql/FL-32_workspace_pairing.sql
      - name: Validate pairing transitions against real PostgreSQL
        working-directory: backend
        env:
          FLEETLUMA_PAIRING_ENABLED: 'true'
        run: python -m pytest -q tests/test_pairing_postgres_integration.py
