name: PostgreSQL integration (FL-15)
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/postgres-integration.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/postgres-integration.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password_only
          POSTGRES_DB: fleetluma_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fleetluma_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FLEETLUMA_TEST_DATABASE_URL: postgresql://postgres:ci_test_password_only@127.0.0.1:5432/fleetluma_ci
      PGPASSWORD: ci_test_password_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies and psql client
        run: |
          python -m pip install -r backend/requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare Supabase role equivalents for isolated CI
        run: |
          psql -h 127.0.0.1 -U postgres -d fleetluma_ci -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated;'
      - name: Apply reviewed PostgreSQL schema
        run: |
          psql -h 127.0.0.1 -U postgres -d fleetluma_ci -v ON_ERROR_STOP=1 -f backend/sql/FL-15_cloud_schema.sql
      - name: Run real PostgreSQL integration tests
        working-directory: backend
        run: python -m pytest -q tests/test_postgres_integration.py
